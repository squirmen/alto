[project]
name = "akl-trees"
version = "0.1.0"
description = "Auckland tree inventory, remote sensing, and ecosystem service valuation pipeline."
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.0",
  "geopandas>=1.0",
  "numpy>=1.26",
  "pandas>=2.2",
  "pillow>=10.3",
  "pyarrow>=16",
  "pyogrio>=0.9",
  "pyproj>=3.6",
  "rasterio>=1.3",
  "requests>=2.32",
  "rioxarray>=0.15",
  "scikit-learn>=1.4",
  "scikit-image>=0.23",
  "scipy>=1.12",
  "shapely>=2.0",
  "xarray>=2024.5",
]

[project.optional-dependencies]
dev = [
  "ipykernel>=6.29",
  "pytest>=8.2",
  "ruff>=0.5",
]
lidar = [
  "laspy>=2.5",
  "lazrs>=0.6",
]
ml = [
  "torch>=2.2",
  "torchvision>=0.17",
]
deepforest = [
  "deepforest>=1.4",
]

[tool.ruff]
line-length = 100
target-version = "py311"
